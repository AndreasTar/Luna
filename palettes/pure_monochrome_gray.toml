# Luna palette.
luna_palette_version = 1

id = "pure_monochrome_gray"
name = "Pure Monochrome Gray"
description = "Fully monochrome, including the meaningful roles. Success, warning and error are told apart by brightness rather than hue."
appearance = "dark"
author = "Andreas Tarasidis"

[colors]
primary                = "#000000"
secondary              = "#323232"
tertiary               = "#646464"
quaternary             = "#969696"

text                   = "#ffffff"
text_secondary         = "#c8c8c8"
text_tertiary          = "#b4b4b4"
text_quaternary        = "#969696"

background             = "#191919"
background_secondary   = "#323232"
background_tertiary    = "#505050"
background_quaternary  = "#646464"

border                 = "#969696"
border_secondary       = "#b4b4b4"
border_tertiary        = "#c8c8c8"
border_quaternary      = "#646464"

success                = "#ffffff"
warning                = "#646464"
error                  = "#323232"
info                   = "#969696"
danger                 = "#c8c8c8"

inactive               = "#505050"
disabled               = "#323232"

highlight              = "#ffffff"
