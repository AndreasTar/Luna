id          = "luna.calendar"
name        = "Calendar"
version     = "0.2.0"
description = "Monthly, daily and yearly views, with notes and upcoming events."
category    = "time"

# Reminders have to fire with the page closed, and with Luna in the tray, so the
# calendar runs a background half that registers them with the scheduler at startup.
background = true

offers  = ["luna/text"]
accepts = ["luna/text"]

state_schema = 1
